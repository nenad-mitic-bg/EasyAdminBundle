# Basic config common to all functional tests
# Can be easily overridden in each test config
parameters:
    locale: en

framework:
    secret:          secret
    translator:      ~
    default_locale:  '%locale%'
    test:            ~
    router:          { resource: '%kernel.project_dir%/tests/Fixtures/App/config/routing_base.yml' }
    form:            true
    profiler:
        collect: true
    session:
        storage_factory_id: session.storage.factory.mock_file

doctrine:
    dbal:
        url: 'sqlite:///%kernel.project_dir%/build/test.db'
    orm:
        auto_mapping: true
        mappings:
            # UnitTestEntities:
            #     mapping: true
            #     type: annotation
            #     dir: '%kernel.root_dir%/../AppTestBundle/Entity/UnitTests/'
            #     alias: 'UnitTests'
            #     prefix: 'AppTestBundle\Entity\UnitTests'
            #     is_bundle: false
            FunctionalTestEntities:
                mapping: true
                type: attribute
                dir: '%kernel.project_dir%/tests/Fixtures/AppTestBundle/Entity/FunctionalTests/'
                alias: 'FunctionalTests'
                prefix: 'AppTestBundle\Entity\FunctionalTests'
                is_bundle: false

twig:
    strict_variables: '%kernel.debug%'

security:
    firewalls:
        main:
            pattern: ^/
    providers:
        in_memory:
             memory: ~

services:
    logger:
        class: Psr\Log\NullLogger

    fixtures_categories:
        class: 'AppTestBundle\DataFixtures\ORM\LoadCategories'
        tags:
            - { name: 'doctrine.fixture.orm' }

    fixtures_products:
        class: 'AppTestBundle\DataFixtures\ORM\LoadProducts'
        tags:
            - { name: 'doctrine.fixture.orm' }

    fixtures_purchases:
        class: 'AppTestBundle\DataFixtures\ORM\LoadPurchases'
        tags:
            - { name: 'doctrine.fixture.orm' }

    fixtures_users:
        class: 'AppTestBundle\DataFixtures\ORM\LoadUsers'
        tags:
            - { name: 'doctrine.fixture.orm' }
